[project]
name = "trmoke_analysis"
version = "1.3.0"
description = "trMOKE analysis tools"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["udkm", "MOKE", "data analysis"]
authors = [
  {name = "UDKM", email = "udkm-group@uni-potsdam.de"},
  {name = "Constantin Walz", email = "cwalz@uni-potsdam.de"}
]
maintainers = [
  {name = "Constantin Walz", email = "cwalz@uni-potsdam.de"}
]
dependencies = [
    "astropy>=7.2.0",
    "matplotlib>=3.10.9",
    "netCDF4>=1.7.4",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    "xarray>=2026.4.0"
]
[dependency-groups]
dev = [                              # tools for you, not for users of the code
    "ruff",                          # formatter/linter in the terminal (VS Code has its own)
    "ipykernel",                     # so notebooks / interactive window work
]

# ── Ruff: formatting & linting ──────────────────────────────────
[tool.ruff]
line-length = 120
# target Python version is read from requires-python automatically

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, ...)
    "B",   # flake8-bugbear (likely bugs)
    "I",   # isort (sorted imports)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "B018",  # "useless expression" – normal in notebooks / # %% cells
    "E402",  # import not at top of file – common in analysis scripts
]
unfixable = ["F401"]  # never auto-delete unused imports on save

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["trmoke_analysis*"]
